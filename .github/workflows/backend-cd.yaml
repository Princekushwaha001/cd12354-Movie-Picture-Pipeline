name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test

  build:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        working-directory: starter/backend
        run: |
          docker build -t "$ECR_REPOSITORY:$GITHUB_SHA" .
          docker push "$ECR_REPOSITORY:$GITHUB_SHA"

  deploy:
    name: Deploy Backend to EKS
    runs-on: ubuntu-latest
    needs: build

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy backend to EKS
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend="$ECR_REPOSITORY:$GITHUB_SHA"
          kustomize build . | kubectl apply -f -

      - name: Verify backend rollout
        run: |
          kubectl rollout status deployment/backend --timeout=180s

      - name: Wait for backend LoadBalancer
        run: |
          BACKEND_ADDRESS=""

          for attempt in $(seq 1 30); do
            HOST=$(kubectl get svc backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            IP=$(kubectl get svc backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$HOST" ]; then
              BACKEND_ADDRESS="$HOST"
              break
            elif [ -n "$IP" ]; then
              BACKEND_ADDRESS="$IP"
              break
            fi

            echo "Waiting for backend LoadBalancer... ($attempt/30)"
            sleep 10
          done

          if [ -z "$BACKEND_ADDRESS" ]; then
            echo "Backend LoadBalancer address was not assigned."
            kubectl describe svc backend
            exit 1
          fi

          echo "BACKEND_URL=http://$BACKEND_ADDRESS" >> "$GITHUB_ENV"
          echo "Backend URL: http://$BACKEND_ADDRESS"

      - name: Verify backend API response
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "$BACKEND_URL/movies" \
              -o /tmp/movies.json; then

              if jq -e '
                (.movies | length == 3) and
                (.movies | any(.[]; .title == "Top Gun: Maverick")) and
                (.movies | any(.[]; .title == "Sonic the Hedgehog")) and
                (.movies | any(.[]; .title == "A Quiet Place"))
              ' /tmp/movies.json > /dev/null; then
                echo "Backend API verification successful."
                cat /tmp/movies.json
                exit 0
              fi
            fi

            echo "Waiting for backend API... ($attempt/30)"
            sleep 10
          done

          echo "Backend API verification failed."
          cat /tmp/movies.json || true
          exit 1